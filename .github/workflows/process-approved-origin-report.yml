name: Process approved origin reports





on:

  issues:

    types: [labeled]





permissions:

  contents: write

  issues: read





jobs:

  process:

    if: github.event.label.name == 'approved' && contains(github.event.issue.title, '[Origin report]')

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4





      - name: Add approved record

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require('fs');

            const path = 'miu-model-origins.json';

            const body = context.payload.issue.body || '';

            const value = (label) => {

              const match = body.match(new RegExp(`^- ${label}:\\s*(.*)$`, 'mi'));

              return match ? match[1].trim() : '';

            };





            const productUrl = value('Product page');

            const brand = value('Brand');

            const model = value('Model name or number') || value('Model/item number');

            const proposed = value('Proposed classification');

            const country = value('Country, if known');

            const asinMatch = productUrl.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})/i);

            const asin = asinMatch ? asinMatch[1].toUpperCase() : '';





            if (!asin || !country || !brand || !['Made in USA', 'US Assembled', 'Other country'].includes(proposed)) {

              core.setFailed('Issue must contain an ASIN, brand, country, and supported classification.');

              return;

            }





            const countryCodes = {

              China: 'cn',

              Mexico: 'mx',

              Vietnam: 'vn',

              Taiwan: 'tw',

              Japan: 'jp',

              Germany: 'de',

              Italy: 'it',

              India: 'in',

              France: 'fr',

              Canada: 'ca',

              USA: 'us',

              'United States': 'us'

            };

            const normalizedCountry = country.replace(/^not provided$/i, '').trim();

            const origin = proposed === 'Made in USA' ? 'usa' : proposed === 'US Assembled' ? 'usa_mixed' : 'non-usa';

            const record = {

              brand,

              model: model === 'Not provided' ? '' : model,

              origin,

              country: normalizedCountry,

              country_code: countryCodes[normalizedCountry] || '',

              confidence: proposed === 'US Assembled' ? 0.75 : 1,

              source: 'manual_review',

              source_issue: context.payload.issue.number,

              note: `Approved from GitHub issue #${context.payload.issue.number}.`

            };





            const data = JSON.parse(fs.readFileSync(path, 'utf8'));

            data.by_asin = data.by_asin || {};

            data.by_asin[asin] = record;

            data.generated_at = new Date().toISOString();

            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');





      - name: Commit approved record

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add miu-model-origins.json

          git diff --cached --quiet || git commit -m "Add approved origin report"

          git push



  remove_rejected:
    if: github.event.label.name == 'rejected' && contains(github.event.issue.title, '[Origin report]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove rejected records
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'miu-model-origins.json';
            const body = context.payload.issue.body || '';
            const value = (label) => {
              const match = body.match(new RegExp(`^- ${label}:\\s*(.*)$`, 'mi'));
              return match ? match[1].trim() : '';
            };

            const productUrl = value('Product page');
            const asinFromIssue = value('ASIN');
            const asinMatch = productUrl.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})/i);
            const asin = (asinFromIssue.match(/[A-Z0-9]{10}/i) || asinMatch || [''])[0].toUpperCase();
            const issueNumber = context.payload.issue.number;
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            let removed = false;

            if (asin && data.by_asin?.[asin]?.source_issue === issueNumber) {
              delete data.by_asin[asin];
              removed = true;
            }

            if (Array.isArray(data.by_brand_model)) {
              const originalLength = data.by_brand_model.length;
              data.by_brand_model = data.by_brand_model.filter(entry => entry.source_issue !== issueNumber);
              removed = removed || data.by_brand_model.length !== originalLength;
            }

            if (!removed) {
              core.info(`No database records found for issue #${issueNumber}.`);
              return;
            }

            data.generated_at = new Date().toISOString();
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

      - name: Commit rejected-record removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miu-model-origins.json
          git diff --cached --quiet || git commit -m "Remove rejected origin report"
          git push
